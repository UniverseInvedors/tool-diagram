let engine = 'mermaid', theme = 'dark', currentSVG = '', renderTimer = null, uid = 0
let allTemplates = Object.entries(TEMPLATES).flatMap(([cat, items]) => items.map(i => ({...i, cat})))

mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', fontSize: 14 })

// ── RENDER TEMPLATES SIDEBAR ──────────────────────────────
function renderTemplateList(filter = '') {
  const list = document.getElementById('template-list')
  const q = filter.toLowerCase()
  const filtered = q ? allTemplates.filter(t => t.name.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q)) : null

  if (filtered) {
    list.innerHTML = filtered.map(t => `<div class="tpl-item" onclick="loadTemplate(${JSON.stringify(t).replace(/"/g,'&quot;')})"><span class="tpl-icon">${t.icon}</span>${t.name}</div>`).join('')
    return
  }

  list.innerHTML = Object.entries(TEMPLATES).map(([cat, items]) => `
    <div class="tpl-group">
      <div class="tpl-label">📂 ${cat}</div>
      <div class="tpl-list">${items.map(t => `<div class="tpl-item" onclick='loadTemplate(${JSON.stringify(t)})'><span class="tpl-icon">${t.icon}</span>${t.name}</div>`).join('')}</div>
    </div>`).join('')
}

window.filterTemplates = (q) => renderTemplateList(q)

window.loadTemplate = (t) => {
  const item = typeof t === 'string' ? JSON.parse(t) : t
  if (item.engine !== engine) setEngine(item.engine, document.querySelector(`.et:nth-child(${['mermaid','nomnoml','plantuml'].indexOf(item.engine)+1})`))
  document.getElementById('code').value = item.code
  document.querySelectorAll('.tpl-item').forEach(el => el.classList.remove('active'))
  renderNow()
}

// ── ENGINE SWITCHER ────────────────────────────────────────
window.setEngine = (eng, btn) => {
  engine = eng
  document.querySelectorAll('.et').forEach(t => t.classList.remove('active'))
  btn?.classList.add('active')
  document.getElementById('engine-label').textContent = {mermaid:'Mermaid v11',nomnoml:'Nomnoml',plantuml:'PlantUML (Preview)'}[eng]
  document.getElementById('ib-engine').textContent = engine
  renderNow()
}

window.changeTheme = (t) => {
  theme = t
  mermaid.initialize({ startOnLoad: false, theme: t, securityLevel: 'loose', fontSize: 14 })
  renderNow()
}

// ── RENDER ─────────────────────────────────────────────────
window.renderNow = async () => {
  const code = document.getElementById('code').value.trim()
  const body = document.getElementById('preview-body')
  if (!code) { body.innerHTML = '<p style="color:var(--t3);font-size:.85rem">Start typing to see your diagram…</p>'; return }

  try {
    let svg
    if (engine === 'mermaid') {
      const id = 'm' + (++uid)
      const result = await window.__mermaid.render(id, code)
      svg = result.svg
      const typeMatch = code.trim().match(/^(\w+)/)
      document.getElementById('ib-type').textContent = typeMatch?.[1] || ''
    } else if (engine === 'nomnoml') {
      svg = window.__nomnoml.renderSvg(code)
    } else if (engine === 'plantuml') {
      // PlantUML via server (plantuml.com free API)
      const encoded = encodePlantUML(code)
      body.innerHTML = `<img src="https://www.plantuml.com/plantuml/svg/${encoded}" alt="PlantUML diagram" style="max-width:100%;filter:drop-shadow(0 4px 24px rgba(0,0,0,.4))">`
      currentSVG = ''
      document.getElementById('preview-info').textContent = 'PlantUML server render'
      return
    }
    currentSVG = svg
    body.innerHTML = svg
    const svgEl = body.querySelector('svg')
    if (svgEl) {
      svgEl.style.maxWidth = '100%'; svgEl.style.height = 'auto'
      document.getElementById('preview-info').textContent = `${Math.round(svgEl.getBoundingClientRect().width)}×${Math.round(svgEl.getBoundingClientRect().height)}px`
    }
  } catch(e) {
    body.innerHTML = `<div class="err">⚠ Syntax Error\n\n${e.message || e}</div>`
  }
}

window.scheduleRender = () => {
  if (!document.getElementById('auto-render').checked) return
  clearTimeout(renderTimer)
  renderTimer = setTimeout(renderNow, 450)
}

// ── PLANTUML ENCODING ──────────────────────────────────────
function encodePlantUML(text) {
  const data = new TextEncoder().encode(text)
  const deflated = pako_deflate(data)
  return encode64(deflated)
}
function pako_deflate(data) {
  // Simplified: just base64 encode the text for now, actual deflate needs pako
  return Array.from(new TextEncoder().encode('~1' + btoa(String.fromCharCode(...Array.from(new TextEncoder().encode(text))))))
}
function encode64(data) {
  const b = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_'
  let result = '', i = 0
  while (i < data.length) {
    const b1 = data[i++] ?? 0, b2 = data[i++] ?? 0, b3 = data[i++] ?? 0
    result += b[b1>>2] + b[((b1&3)<<4)|(b2>>4)] + b[((b2&15)<<2)|(b3>>6)] + b[b3&63]
  }
  return result
}

// ── EXPORTS ────────────────────────────────────────────────
window.copyCode = () => navigator.clipboard.writeText(document.getElementById('code').value).then(() => toast('Code copied','ok'))
window.copySVG = () => { if (!currentSVG) { toast('Render a diagram first','err'); return }; navigator.clipboard.writeText(currentSVG).then(() => toast('SVG copied','ok')) }
window.downloadSVG = () => {
  if (!currentSVG) { toast('Render first','err'); return }
  const a = document.createElement('a'); a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(currentSVG); a.download = 'diagram.svg'; a.click()
}
window.downloadPNG = () => {
  if (!currentSVG) { toast('Render first','err'); return }
  const svgEl = document.querySelector('#preview-body svg'); if (!svgEl) return
  const w = svgEl.getBoundingClientRect().width || 800, h = svgEl.getBoundingClientRect().height || 600
  const canvas = document.createElement('canvas'); canvas.width = w*2; canvas.height = h*2
  const ctx = canvas.getContext('2d'); ctx.scale(2,2)
  const img = new Image()
  img.onload = () => {
    ctx.fillStyle = '#090c13'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0)
    const a = document.createElement('a'); a.download = 'diagram.png'; a.href = canvas.toDataURL('image/png'); a.click()
    toast('PNG downloaded','ok')
  }
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(currentSVG)
}

// ── RESIZER ────────────────────────────────────────────────
;(function(){
  const rsz = document.getElementById('rsz'), ew = document.getElementById('editor-wrap')
  let drag = false, sx, sw
  rsz.addEventListener('mousedown', e => { drag=true; sx=e.clientX; sw=ew.offsetWidth; document.body.style.cssText='cursor:col-resize;user-select:none' })
  document.addEventListener('mousemove', e => { if(!drag) return; ew.style.width = Math.max(180, Math.min(window.innerWidth-200, sw+e.clientX-sx)) + 'px' })
  document.addEventListener('mouseup', () => { drag=false; document.body.style.cssText='' })
})()

window.handleTabKey = (e) => {
  if (e.key !== 'Tab') return; e.preventDefault()
  const ta = e.target, s = ta.selectionStart
  ta.value = ta.value.slice(0,s) + '  ' + ta.value.slice(ta.selectionEnd)
  ta.selectionStart = ta.selectionEnd = s + 2
}

document.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { e.preventDefault(); renderNow() } })

window.toast = (msg, type='') => {
  const el = document.createElement('div'); el.className = 'toast'+(type?' '+type:''); el.textContent = msg
  document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(), 2800)
}

// Init
renderTemplateList()
const firstTemplate = allTemplates[0]
document.getElementById('code').value = firstTemplate.code
renderNow()
</script>
