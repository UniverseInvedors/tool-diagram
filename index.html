<style>

/* Resizer */

.seo-footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem .75rem;padding:.4rem .85rem;border-top:1px solid var(--border);background:var(--surf);font-size:.67rem;color:var(--t3);flex-shrink:0}

@media(max-width:680px){.sb{display:none}.editor-wrap{width:100%;border-right:none}.preview-wrap{display:none}}

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
import nomnoml from 'https://cdn.jsdelivr.net/npm/nomnoml@1.6.2/dist/nomnoml.esm.js'
window.__mermaid = mermaid
window.__nomnoml = nomnoml

const EXAMPLES = {
  flow:`flowchart TD
    A([Start]) --> B{Authentication}
    B -->|✓ Valid| C[Load Dashboard]
    B -->|✗ Invalid| D[Show Error]
    D --> E[Retry?]
    E -->|Yes| B
    E -->|No| F([End])
    C --> G[Fetch User Data]
    G --> H[Render UI]
    H --> F`,
  seq:`sequenceDiagram
    autonumber
    actor User
    participant App
    participant API
    participant DB

    User->>App: Submit Login Form
    App->>API: POST /auth/login
    API->>DB: SELECT user WHERE email=?
    DB-->>API: User record
    API->>API: Verify password hash
    alt Valid Credentials
        API-->>App: 200 OK + JWT token
        App-->>User: Redirect to dashboard
    else Invalid
        API-->>App: 401 Unauthorized
        App-->>User: Show error message
    end`,
  class:`classDiagram
    class Vehicle {
        +String make
        +String model
        +int year
        +start() bool
        +stop() void
    }
    class Car {
        +int numDoors
        +openTrunk() void
    }
    class Truck {
        +float payload
        +attachTrailer() void
    }
    class ElectricVehicle {
        +int batteryCapacity
        +charge() void
        +getRange() int
    }
    Vehicle <|-- Car
    Vehicle <|-- Truck
    Car <|-- ElectricVehicle`,
  er:`erDiagram
    USER {
        int    id          PK
        string email       UK
        string name
        string role
        date   created_at
    }
    POST {
        int    id          PK
        int    user_id     FK
        string title
        text   content
        string status
        date   published_at
    }
    COMMENT {
        int    id          PK
        int    post_id     FK
        int    user_id     FK
        text   body
        date   created_at
    }
    TAG {
        int    id          PK
        string name        UK
    }
    POST_TAGS {
        int    post_id     FK
        int    tag_id      FK
    }
    USER ||--o{ POST : "writes"
    POST ||--o{ COMMENT : "has"
    USER ||--o{ COMMENT : "writes"
    POST ||--o{ POST_TAGS : "tagged with"
    TAG ||--o{ POST_TAGS : "applied to"`,
  state:`stateDiagram-v2
    [*] --> Idle
    Idle --> Loading : user.submit()
    Loading --> Success : data.received
    Loading --> Error : request.failed
    Error --> Idle : user.retry()
    Error --> [*] : user.cancel()
    Success --> Idle : user.reset()
    Success --> [*] : session.end()

    state Loading {
        [*] --> Fetching
        Fetching --> Parsing : response.ok
        Parsing --> [*]
    }`,
  gantt:`gantt
    title  Product Launch Timeline
    dateFormat  YYYY-MM-DD
    excludes weekends

    section Discovery
    Market Research    :done,    res1, 2024-01-01, 10d
    User Interviews    :done,    res2, after res1, 7d

    section Design
    Wireframes         :active,  des1, 2024-01-20, 7d
    UI Design          :         des2, after des1, 10d
    Design Review      :crit,    des3, after des2, 3d

    section Development
    Frontend           :         dev1, after des3, 14d
    Backend API        :         dev2, after des3, 14d
    Integration        :crit,    dev3, after dev1, 5d

    section Launch
    QA Testing         :         qa1, after dev3, 7d
    Deployment         :crit,    dep1, after qa1, 2d`,
  git:`gitGraph LR
    commit id: "init"
    branch develop
    checkout develop
    commit id: "feat: auth"
    commit id: "feat: dashboard"
    branch feature/api
    checkout feature/api
    commit id: "feat: REST API"
    commit id: "fix: validation"
    checkout develop
    merge feature/api
    checkout main
    merge develop id: "v1.0.0" tag: "release"
    checkout develop
    commit id: "feat: notifications"`,
  pie:`pie title Tech Stack Usage
    "React / Next.js" : 35
    "Python / FastAPI" : 25
    "Unity / C#" : 20
    "Flutter" : 12
    "AWS / DevOps" : 8`,
  mindmap:`mindmap
    root((Universe Invedors))
        AI & ML
            LLM Applications
            Computer Vision
            AI Agents
        Spatial Computing
            AR/VR/MR
            Digital Twins
            WebXR
        Game Development
            Unity Games
            Multiplayer Systems
            Mobile Games
        Cloud Engineering
            AWS Architecture
            DevOps & CI/CD
            Serverless`,
  nom_uml:`[<abstract>Shape|+area(): float;+perimeter(): float]
[Rectangle|+width: float;+height: float|+area(): float;+perimeter(): float]
[Circle|+radius: float|+area(): float;+perimeter(): float]
[Square|+side: float]

[Shape] <:-- [Rectangle]
[Shape] <:-- [Circle]
[Rectangle] <:-- [Square]`,
  nom_flow:`[<start>Start] -> [Validate Input]
[Validate Input] -> [<decision>Valid?]
[<decision>Valid?] -> [Process Data] : Yes
[<decision>Valid?] -> [Show Error] : No
[Process Data] -> [Save to DB]
[Save to DB] -> [Send Notification]
[Send Notification] -> [<end>Done]
[Show Error] -> [<end>Done]`
}

let engine = 'mermaid', theme = 'dark', currentSVG = '', renderTimer = null, uid = 0

mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', fontSize: 14 })

window.loadEx = (name) => {
  document.getElementById('code').value = EXAMPLES[name] || ''
  document.querySelectorAll('.sbbtn').forEach(b => b.classList.remove('active'))
  event.target.closest('.sbbtn').classList.add('active')
  if (name.startsWith('nom_') && engine !== 'nomnoml') switchEngine('nomnoml', document.querySelectorAll('.et')[1])
  else if (!name.startsWith('nom_') && engine !== 'mermaid') switchEngine('mermaid', document.querySelectorAll('.et')[0])
  renderNow()
}

window.switchEngine = (eng, btn) => {
  engine = eng
  document.querySelectorAll('.et').forEach(t => t.classList.remove('active'))
  btn.classList.add('active')
  document.getElementById('status-engine').textContent = eng === 'mermaid' ? 'Mermaid v11' : eng === 'nomnoml' ? 'Nomnoml' : 'Railroad'
  renderNow()
}

window.changeTheme = (t) => {
  theme = t
  mermaid.initialize({ startOnLoad: false, theme: t, securityLevel: 'loose', fontSize: 14 })
  renderNow()
}

async function renderMermaid(code) {
  const id = 'mer-' + (++uid)
  const { svg } = await window.__mermaid.render(id, code)
  return svg
}

function renderNomnoml(code) {
  return window.__nomnoml.renderSvg(code)
}

window.renderNow = async () => {
  const code = document.getElementById('code').value.trim()
  const area = document.getElementById('preview-area')
  if (!code) { area.innerHTML = '<p style="color:var(--t3);font-size:.85rem">Start typing to see your diagram…</p>'; return }
  try {
    let svg
    if (engine === 'mermaid') {
      svg = await renderMermaid(code)
    } else if (engine === 'nomnoml') {
      svg = renderNomnoml(code)
    } else {
      area.innerHTML = '<p style="color:var(--t3)">Railroad diagrams coming soon.</p>'; return
    }
    currentSVG = svg
    area.innerHTML = svg
    // Fix SVG bg for dark theme
    const svgEl = area.querySelector('svg')
    if (svgEl) {
      svgEl.style.maxWidth = '100%'
      svgEl.style.height = 'auto'
      document.getElementById('preview-info').textContent = `${svgEl.getAttribute('width')||'auto'} × ${svgEl.getAttribute('height')||'auto'}`
    }
  } catch(e) {
    area.innerHTML = `<div class="err-msg">⚠ Syntax error\n\n${e.message || e}</div>`
  }
}

window.scheduleRender = () => {
  if (!document.getElementById('auto-render').checked) return
  clearTimeout(renderTimer)
  renderTimer = setTimeout(renderNow, 500)
}

window.copyCode = () => {
  navigator.clipboard.writeText(document.getElementById('code').value)
    .then(() => toast('Code copied', 'ok'))
}

window.copySVG = () => {
  if (!currentSVG) { toast('Render a diagram first', 'err'); return }
  navigator.clipboard.writeText(currentSVG).then(() => toast('SVG copied', 'ok'))
}

window.downloadSVG = () => {
  if (!currentSVG) { toast('Render a diagram first', 'err'); return }
  const a = document.createElement('a')
  a.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(currentSVG)
  a.download = 'diagram.svg'; a.click()
}

window.downloadPNG = () => {
  if (!currentSVG) { toast('Render a diagram first', 'err'); return }
  const svgEl = document.querySelector('#preview-area svg')
  if (!svgEl) return
  const w = svgEl.getBoundingClientRect().width || 800
  const h = svgEl.getBoundingClientRect().height || 600
  const canvas = document.createElement('canvas')
  canvas.width = w * 2; canvas.height = h * 2
  const ctx = canvas.getContext('2d')
  ctx.scale(2, 2)
  const img = new Image()
  img.onload = () => {
    ctx.fillStyle = '#090c13'; ctx.fillRect(0, 0, w, h)
    ctx.drawImage(img, 0, 0)
    const a = document.createElement('a')
    a.download = 'diagram.png'; a.href = canvas.toDataURL('image/png'); a.click()
    toast('PNG downloaded', 'ok')
  }
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(currentSVG)
}

// Resize
;(function(){
  const rsz = document.getElementById('rsz'), ew = document.getElementById('editor-wrap')
  let drag = false, sx, sw
  rsz.addEventListener('mousedown', e => { drag=true; sx=e.clientX; sw=ew.offsetWidth; document.body.style.cursor='col-resize'; document.body.style.userSelect='none' })
  document.addEventListener('mousemove', e => { if(!drag)return; ew.style.width=Math.max(180,Math.min(window.innerWidth-200,sw+e.clientX-sx))+'px' })
  document.addEventListener('mouseup', () => { drag=false; document.body.style.cursor=''; document.body.style.userSelect='' })
})()

// Keyboard
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();renderNow()} })

// Init
document.getElementById('code').value = EXAMPLES.flow
renderNow()

window.toast = (msg, type='') => {
  const el = document.createElement('div')
  el.className='toast'+(type?' '+type:''); el.textContent=msg
  document.getElementById('toasts').appendChild(el)
  setTimeout(()=>el.remove(),2800)
}
</script>
</body>
</html>
