<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' })
window.__mermaid = mermaid

const EXAMPLES = {
  flowchart: `flowchart TD
    A[Start] --> B{Is it working?}
    B -->|Yes| C[✅ Great!]
    B -->|No| D[Debug the issue]
    D --> E[Fix the bug]
    E --> B
    C --> F[Deploy 🚀]`,
  sequence: `sequenceDiagram
    participant User
    participant API
    participant DB
    User->>API: POST /login
    API->>DB: SELECT user WHERE email=?
    DB-->>API: User record
    API->>API: Validate password
    API-->>User: 200 OK + JWT token`,
  class: `classDiagram
    class Animal {
      +String name
      +int age
      +makeSound() String
    }
    class Dog {
      +fetch() void
    }
    class Cat {
      +purr() void
    }
    Animal <|-- Dog
    Animal <|-- Cat`,
  er: `erDiagram
    USER {
      int id PK
      string email
      string name
      datetime created_at
    }
    ORDER {
      int id PK
      int user_id FK
      float total
      string status
    }
    USER ||--o{ ORDER : places`,
  state: `stateDiagram-v2
    [*] --> Idle
    Idle --> Loading : fetch()
    Loading --> Success : data received
    Loading --> Error : request failed
    Error --> Idle : retry
    Success --> [*]`,
  gantt: `gantt
    title Project Timeline
    dateFormat  YYYY-MM-DD
    section Design
    Wireframes      :a1, 2024-01-01, 7d
    UI Design       :a2, after a1, 10d
    section Dev
    Frontend        :b1, after a2, 14d
    Backend         :b2, after a2, 14d
    section Launch
    QA Testing      :c1, after b1, 7d
    Deploy          :c2, after c1, 2d`
}

let renderTimer = null
let currentSVG = ''

window.loadEx = (name, btn) => {
  document.getElementById('editor').value = EXAMPLES[name]
  document.querySelectorAll('.ex').forEach(e => e.classList.remove('active'))
  btn.classList.add('active')
  render()
}

async function render() {
  const code = document.getElementById('editor').value.trim()
  const preview = document.getElementById('preview')
  if (!code) { preview.innerHTML = '<p style="color:var(--muted);font-size:.85rem">Start typing Mermaid syntax…</p>'; return }
  try {
    const id = `m${Date.now()}`
    const { svg } = await window.__mermaid.render(id, code)
    currentSVG = svg
    preview.innerHTML = svg
  } catch(e) {
    preview.innerHTML = `<div class="error-msg">⚠️ Syntax error\n${e.message||e}</div>`
  }
}

window.scheduleRender = () => {
  clearTimeout(renderTimer)
  renderTimer = setTimeout(render, 500)
}

window.copySVG = () => {
  if (!currentSVG) return
  navigator.clipboard.writeText(currentSVG).then(() => {
    const b = document.querySelector('.btn-copy')
    b.textContent = 'Copied!'
    setTimeout(() => b.textContent = 'Copy SVG', 1500)
  })
}

window.downloadSVG = () => {
  if (!currentSVG) return
  const a = document.createElement('a')
  a.href = 'data:image/svg+xml,' + encodeURIComponent(currentSVG)
  a.download = 'diagram.svg'
  a.click()
}

// Init
document.getElementById('editor').value = EXAMPLES.flowchart
render()
</script>
